# Next.js 16 on Netlify — use the built-in OpenNext adapter (do not pin @netlify/plugin-nextjs).
# Docs: https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/
#
# For your own domain + built-in databases (no Turso), use Docker instead — see docs/HOSTING-SELF.md

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/login"
  [headers.values]
    Cache-Control = "private, no-store, no-cache, must-revalidate"
    CDN-Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/signup"
  [headers.values]
    Cache-Control = "private, no-store, no-cache, must-revalidate"
    CDN-Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"
